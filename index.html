<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三桂班級榮譽榜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-active:active { transform: scale(0.96); transition: 0.1s; }
        .modal-bg { background-color: rgba(0,0,0,0.5); }
        input[type="checkbox"] { width: 1.5rem; height: 1.5rem; cursor: pointer; }
        .amount-option-active { transform: translateY(-1px); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-orange-500 text-white p-5 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold">三桂 榮譽榜</h1>
        <div class="flex items-center gap-2">
            <span class="text-xs">起算日:</span>
            <!-- 加入日期選擇器，預設值可以是今天 -->
            <input type="date" id="date-setter" onchange="updateStartDate(this.value)" 
                class="text-gray-800 text-xs p-1 rounded border-none outline-none">
        </div>
    </nav>
    <div class="text-xs text-orange-500 font-bold mb-2">
        成績結算週期：2026-03-16 至今
    </div>

    <div class="max-w-md mx-auto p-4 pb-24" id="student-list">
        <div class="text-center py-20 text-gray-500 text-xl">連線雲端中...</div>
    </div>

    <button onclick="openBatchModal()" class="fixed bottom-6 right-6 w-16 h-16 bg-orange-600 text-white rounded-full shadow-2xl text-3xl font-bold z-40 active:scale-90 transition-transform">
        ＋
    </button>

    <div id="batch-modal" class="fixed inset-0 modal-bg z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-bold text-gray-800">批量操作</h2>
                <button onclick="closeBatchModal()" class="text-gray-400 text-3xl p-2">&times;</button>
            </div>
            
            <div class="p-6 flex-1 overflow-y-auto">
                <div class="mb-6">
                    <div class="font-bold text-gray-500 mb-3 text-sm text-left">調整分數：</div>
                    <div id="batch-amount-options" class="flex gap-2 overflow-x-auto pb-1"></div>
                </div>

                <div class="mb-6">
                    <div class="font-bold text-gray-500 mb-3 text-sm text-left">常用理由：</div>
                    <div id="batch-reason-presets" class="flex flex-wrap gap-2 mb-3"></div>
                    <input type="text" id="batch-reason" placeholder="或手動輸入理由" class="w-full p-4 border rounded-xl outline-orange-400 text-lg">
                </div>

                <h3 class="font-bold text-gray-500 mb-3 text-sm text-left">選擇學生：</h3>
                <div id="batch-student-select" class="space-y-2">
                    </div>
            </div>

            <div class="p-6 border-t bg-gray-50">
                <button id="submit-batch" onclick="submitBatch()" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold text-xl active:scale-95 shadow-lg">確認送出</button>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="fixed inset-0 modal-bg z-[100] hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center">
                <h2 id="modal-title" class="text-2xl font-bold text-gray-800">學生姓名</h2>
                <button onclick="closeModal()" class="text-gray-400 text-2xl">&times;</button>
            </div>
            
            <div class="p-6">
                <div class="mb-6">
                    <div class="font-bold text-gray-500 mb-3 text-sm text-left">調整分數：</div>
                    <div id="detail-amount-options" class="flex gap-2 overflow-x-auto pb-1"></div>
                </div>

                <div class="mb-8">
                    <div class="font-bold text-gray-500 mb-3 text-sm text-left">常用理由：</div>
                    <div id="detail-reason-presets" class="flex flex-wrap gap-2 mb-3"></div>
                    <input type="text" id="detail-reason" placeholder="或手動輸入理由" class="w-full p-4 border rounded-xl outline-orange-400 text-lg">
                </div>

                <h3 class="font-bold text-gray-500 mb-4 border-l-4 border-orange-400 pl-2 text-sm">歷史加扣分紀錄</h3>
                <!-- From Uiverse.io by Mayurwaghgpr --> 
                <div
                class="hover:scale-x-105 transition-all duration-300 *:transition-all *:duration-300 flex justify-start text-2xl items-center shadow-xl z-10 bg-[#e8e4df] dark:bg-[#191818] gap-2 p-2 rounded-full"
                >
                <button
                    class="before:hidden hover:before:flex before:justify-center before:items-center before:h-4 before:text-[.6rem] before:px-1 before:content-['Like'] before:bg-black dark:before:bg-white dark:before:text-black before:text-white before:bg-opacity-50 before:absolute before:-top-7 before:rounded-lg hover:-translate-y-5 cursor-pointer hover:scale-125 bg-white dark:bg-[#191818] rounded-full p-2 px-3"
                >
                    👍
                </button>
                <button
                    class="before:hidden hover:before:flex before:justify-center before:items-center before:h-4 before:text-[.6rem] before:px-1 before:content-['Cheer'] before:bg-black dark:before:bg-white dark:before:text-black before:text-white before:bg-opacity-50 before:absolute before:-top-7 before:rounded-lg hover:-translate-y-5 cursor-pointer hover:scale-125 bg-white dark:bg-[#191818] rounded-full p-2 px-3"
                >
                    👏🏻
                </button>
                <button
                    class="before:hidden hover:before:flex before:justify-center before:items-center before:h-4 before:text-[.6rem] before:px-1 before:content-['Celebrate'] before:bg-black dark:before:bg-white dark:before:text-black before:text-white before:bg-opacity-50 before:absolute before:-top-7 before:rounded-lg hover:-translate-y-5 cursor-pointer hover:scale-125 bg-white dark:bg-[#191818] rounded-full p-2 px-3"
                >
                    🎉
                </button>
                <button
                    class="before:hidden hover:before:flex before:justify-center before:items-center before:h-4 before:text-[.6rem] before:px-1 before:content-['Appreciate'] before:bg-black dark:before:bg-white dark:before:text-black before:text-white before:bg-opacity-50 before:absolute before:-top-7 before:rounded-lg hover:-translate-y-5 cursor-pointer hover:scale-125 bg-white dark:bg-[#191818] rounded-full p-2 px-3"
                >
                    ✨
                </button>
                <button
                    class="before:hidden hover:before:flex before:justify-center before:items-center before:h-4 before:text-[.6rem] before:px-1 before:content-['Smile'] before:bg-black dark:before:bg-white dark:before:text-black before:text-white before:bg-opacity-50 before:absolute before:-top-7 before:rounded-lg hover:-translate-y-5 cursor-pointer hover:scale-125 bg-white dark:bg-[#191818] rounded-full p-2 px-3"
                >
                    🙂
                </button>
                <button
                    class="before:hidden hover:before:flex before:justify-center before:items-center before:h-4 before:text-[.6rem] before:px-1 before:content-['Smile'] before:bg-black dark:before:bg-white dark:before:text-black before:text-white before:bg-opacity-50 before:absolute before:-top-7 before:rounded-lg hover:-translate-y-5 cursor-pointer hover:scale-125 bg-white dark:bg-[#191818] rounded-full p-2 px-3"
                >
                    💪
                </button>
                </div>

                <div id="log-list" class="space-y-3 max-h-60 overflow-y-auto pr-2 text-sm">
                    <p class="text-center text-gray-400 py-4">尚無紀錄</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, addDoc, where, writeBatch, increment, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNSfMo7ASbkNOJiQQg6jDwq6dkUYohwDY",
            authDomain: "helpingmymama.firebaseapp.com",
            projectId: "helpingmymama",
            storageBucket: "helpingmymama.firebasestorage.app",
            messagingSenderId: "761189443645",
            appId: "1:761189443645:web:c1061d40916076ba526254",
            measurementId: "G-BLQY5LNWPX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const savedDate = localStorage.getItem('selectedStartDate') || "2026-05-04";
        let WEEK_START = new Date(savedDate + "T00:00:00");

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date-setter').value = savedDate;
            const infoDiv = document.querySelector('.text-xs.text-orange-500');
            if (infoDiv) infoDiv.innerText = `成績結算週期：${savedDate} 至今`;
        });

        window.updateStartDate = (dateString) => {
            if (!dateString) return;
            
            localStorage.setItem('selectedStartDate', dateString);
            
            location.reload(); 
        };
        
        let currentStudent = null;
        let allStudents = []; 
        let batchAmount = 1;
        let detailAmount = 1;

        const amountOptions = [-3, -2, -1, 1, 2, 3];
        const reasonOptions = ["午餐吃完", "聽寫簽訂", "完成打掃", "作業未完成", "上課講話", "主動幫忙"];

        function amountButtonClass(amount, selectedAmount) {
            const base = "min-w-[4.5rem] px-4 py-3 rounded-xl font-bold text-lg border-2 transition-all active:scale-95";
            const selected = amount === selectedAmount;
            if (amount > 0) {
                return `${base} ${selected ? "border-green-500 text-green-700 bg-green-50 amount-option-active" : "border-gray-200 text-gray-500 bg-white"}`;
            }
            return `${base} ${selected ? "border-red-500 text-red-700 bg-red-50 amount-option-active" : "border-gray-200 text-gray-500 bg-white"}`;
        }

        function renderAmountOptions(containerId, selectedAmount, onClickName) {
            const container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = amountOptions.map((amount) => {
                const label = amount > 0 ? `+${amount}` : `${amount}`;
                return `<button type="button" onclick="${onClickName}(${amount})" class="${amountButtonClass(amount, selectedAmount)}">${label}</button>`;
            }).join('');
        }

        function renderReasonPresets(containerId, inputId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = reasonOptions.map((reason) => {
                return `<button type="button" onclick="setReasonText('${inputId}', '${reason}')" class="px-4 py-2 rounded-full border border-orange-200 bg-orange-50 text-orange-700 font-medium text-sm active:scale-95">${reason}</button>`;
            }).join('');
        }

        window.setReasonText = (inputId, reason) => {
            const input = document.getElementById(inputId);
            if (!input) return;
            input.value = reason;
            input.focus();
        };

        //const qStudents = query(collection(db, "students"), orderBy("total_points", "desc"));
        const qStudents = query(collection(db, "students"));
        onSnapshot(qStudents, async (snapshot) => {
            const listDiv = document.getElementById('student-list');
            
            const scorePromises = snapshot.docs.map(async (d) => {
                const s = d.data();
                const sid = d.id;

                const qWeekly = query(
                    collection(db, "logs"),
                    where("student_id", "==", sid),
                    where("timestamp", ">=", WEEK_START)
                );
                
                const logSnap = await getDocs(qWeekly);
                
                let weeklyScore = 0;
                logSnap.forEach(logDoc => {
                    weeklyScore += logDoc.data().amount;
                });

                return { ...s, id: sid, weeklyScore: weeklyScore };
            });

            const studentsWithWeekly = await Promise.all(scorePromises);
            allStudents = studentsWithWeekly;

            studentsWithWeekly.sort((a, b) => b.weeklyScore - a.weeklyScore || a.seat_number - b.seat_number);

            listDiv.innerHTML = "";
            studentsWithWeekly.forEach(s => {
                listDiv.innerHTML += `
                    <div class="bg-white p-6 mb-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center card-active cursor-pointer" 
                        onclick="openModal('${s.id}', '${s.name}', ${s.total_points})">
                        <div class="flex items-center gap-4">
                            <span class="text-orange-200 font-bold">#${s.seat_number}</span>
                            <span class="text-xl font-bold text-gray-800">${s.name}</span>
                        </div>
                        <div class="text-3xl font-black text-orange-600">${s.weeklyScore}</div>
                    </div>`;
            });
        });

        window.openModal = async (id, name, points) => {
            currentStudent = { id, name, points };
            document.getElementById('modal-title').innerText = name;
            detailAmount = 1;
            document.getElementById('detail-reason').value = "";
            renderAmountOptions('detail-amount-options', detailAmount, 'changePoints');
            renderReasonPresets('detail-reason-presets', 'detail-reason');
            document.getElementById('detail-modal').classList.remove('hidden');
            loadLogs(id); 
        };

        window.closeModal = () => {
            document.getElementById('detail-modal').classList.add('hidden');
        };

        window.changePoints = async (amount) => {
            if (!currentStudent) return;
            const reasonInput = document.getElementById('detail-reason');
            const reason = reasonInput.value || (amount > 0 ? "表現優良" : "秩序不佳");

            try {
                await updateDoc(doc(db, "students", currentStudent.id), {
                    total_points: currentStudent.points + amount
                });
                await addDoc(collection(db, "logs"), {
                    student_id: currentStudent.id,
                    amount: amount,
                    reason: reason,
                    timestamp: new Date()
                });
                currentStudent.points += amount;
            } catch (e) { alert("更新失敗！"); }
        };

        function loadLogs(studentId) {
            const logList = document.getElementById('log-list');

            const qLogs = query(
                collection(db, "logs"), 
                where("student_id", "==", studentId), 
                where("timestamp", ">=", WEEK_START),
                orderBy("timestamp", "desc")
            );

            onSnapshot(qLogs, (snapshot) => {
                logList.innerHTML = snapshot.empty ? '<p class="text-center text-gray-400 py-4">尚無紀錄</p>' : "";
                snapshot.forEach(d => {
                    const l = d.data();
                    const date = l.timestamp?.toDate().toLocaleString() || "讀取中";
                    logList.innerHTML += `
                        <div class="flex justify-between items-start bg-gray-50 p-3 rounded-lg border-l-4 ${l.amount > 0 ? 'border-green-400' : 'border-red-400'} mb-2">
                            <div>
                                <div class="font-bold text-gray-700 text-left">${l.reason}</div>
                                <div class="text-[10px] text-gray-400 text-left">${date}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="font-bold ${l.amount > 0 ? 'text-green-600' : 'text-red-600'}">${l.amount > 0 ? '+' : ''}${l.amount}</div>
                                <button onclick="deleteLog('${d.id}', ${l.amount}, '${l.student_id}')" class="text-red-400 font-bold px-1">✕</button>
                            </div>
                        </div>`;
                });
            });
        } 

        window.deleteLog = async (logId, amount, studentId) => {
            if(!confirm("確定要撤回這筆紀錄嗎？")) return;
            
            try {
                const batch = writeBatch(db);
                batch.delete(doc(db, "logs", logId));
                const studentRef = doc(db, "students", studentId);
                batch.update(studentRef, { total_points: increment(-amount) }); 
                
                await batch.commit();
                alert("撤回成功");
            } catch (e) {
                console.error(e);
                alert("撤回失敗，請檢查 Console 報錯");
            }
        };

        window.openBatchModal = () => {
            const selectDiv = document.getElementById('batch-student-select');
            const sortedBySeat = [...allStudents].sort((a, b) => a.seat_number - b.seat_number);
            batchAmount = 1;
            document.getElementById('batch-reason').value = "";
            renderAmountOptions('batch-amount-options', batchAmount, 'setBatchAmount');
            renderReasonPresets('batch-reason-presets', 'batch-reason');
            
            selectDiv.innerHTML = sortedBySeat.map(s => `
                <label class="flex items-center gap-4 p-4 border rounded-xl active:bg-orange-50 cursor-pointer">
                    <input type="checkbox" name="student-check" value="${s.id}" data-name="${s.name}" data-points="${s.total_points}">
                    <span class="text-gray-400 font-bold w-8">#${s.seat_number}</span>
                    <span class="text-lg font-medium">${s.name}</span>
                </label>
            `).join('');
            
            document.getElementById('batch-modal').classList.remove('hidden');
        };

        window.closeBatchModal = () => document.getElementById('batch-modal').classList.add('hidden');

        window.setBatchAmount = (amt) => {
            batchAmount = amt;
            renderAmountOptions('batch-amount-options', batchAmount, 'setBatchAmount');
        };

        window.submitBatch = async () => {
            const reasonInput = document.getElementById('batch-reason');
            const reason = reasonInput.value || (batchAmount > 0 ? "表現優良" : "秩序不佳");
            const selected = document.querySelectorAll('input[name="student-check"]:checked');
            
            if (selected.length === 0) return alert("請至少選擇一位學生");

            const batch = writeBatch(db);
            const btn = document.getElementById('submit-batch');
            btn.disabled = true;
            btn.innerText = "正在儲存";

            selected.forEach(input => {
                const id = input.value;
                const name = input.dataset.name;
                const oldPoints = parseInt(input.dataset.points);
                
                batch.update(doc(db, "students", id), { total_points: oldPoints + batchAmount });
                batch.set(doc(collection(db, "logs")), {
                    student_id: id,
                    student_name: name,
                    amount: batchAmount,
                    reason: reason,
                    timestamp: new Date()
                });
            });

            try {
                await batch.commit();
                alert(`已更新 ${selected.length} 位 學生分數`);
                reasonInput.value = "";
                closeBatchModal();
            } catch (e) { alert("更新失敗"); }
            finally { 
                btn.disabled = false; 
                btn.innerText = "確認送出";
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            renderAmountOptions('detail-amount-options', detailAmount, 'changePoints');
            renderAmountOptions('batch-amount-options', batchAmount, 'setBatchAmount');
            renderReasonPresets('detail-reason-presets', 'detail-reason');
            renderReasonPresets('batch-reason-presets', 'batch-reason');
        });
    </script>
</body>
</html>
